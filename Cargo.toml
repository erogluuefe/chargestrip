[package]
name = "pil-gostergesi"
version = "0.1.0"
edition = "2021"
description = "Kablosuz kulaklık ve farenin pil durumunu taskbar / menü çubuğunda gösterir"

[dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
tray-icon = "0.21"
auto-launch = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
tao = "0.34"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
