[package]
name = "chargestrip"
version = "0.5.1"
edition = "2021"
description = "Battery levels of wireless headsets, mice, keyboards and Bluetooth devices in the Windows taskbar and the macOS menu bar"
license = "GPL-3.0-or-later"
repository = "https://github.com/erogluuefe/chargestrip"

[dependencies]
# Pure Rust backend on Windows (no C build); macOS uses the IOKit backend automatically.
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

[target.'cfg(windows)'.dependencies]
# Same version as hidapi's, so only one copy is built.
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# Unconditional: build.rs is compiled on every host but only embeds resources for Windows targets.
[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
tao = "0.34"
tray-icon = "0.21"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
