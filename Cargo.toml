[package]
name = "pil-gostergesi"
version = "0.2.0"
edition = "2021"
description = "Kablosuz cihazların pil durumunu Windows taskbar'ında / macOS menü çubuğunda gösterir"

[dependencies]
# Windows'ta saf Rust arka uç (C derlemesi yok); macOS'ta IOKit arka ucu otomatik seçilir.
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

[target.'cfg(windows)'.dependencies]
# hidapi ile aynı sürüm: tek kopya derlenir.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
embed-manifest = "1.4"

[target.'cfg(target_os = "macos")'.dependencies]
tao = "0.34"
tray-icon = "0.21"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
