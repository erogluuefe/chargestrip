[package]
name = "chargestrip"
version = "0.5.1"
edition = "2021"
description = "Kablosuz cihazların pil durumunu Windows taskbar'ında / macOS menü çubuğunda gösterir"
license = "GPL-3.0-or-later"
repository = "https://github.com/erogluuefe/chargestrip"

[dependencies]
# Windows'ta saf Rust arka uç (C derlemesi yok); macOS'ta IOKit arka ucu otomatik seçilir.
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

[target.'cfg(windows)'.dependencies]
# hidapi ile aynı sürüm: tek kopya derlenir.
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# Koşulsuz: build.rs her makinede derlenir; manifesti yalnızca Windows hedefinde gömer.
[build-dependencies]
embed-manifest = "1.4"
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
tao = "0.34"
tray-icon = "0.21"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
