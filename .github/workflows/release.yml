# Release: pushing a tag such as "v1.2.3" builds the Windows installer and the macOS disk image
# and publishes them on GitHub Releases. It can also be run by hand from the Actions tab; that only
# builds and keeps the files as artifacts, without creating a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$cargo") {
            throw "Tag ${{ github.ref_name }} does not match the Cargo.toml version (v$cargo)"
          }
          "version=$cargo" >> $env:GITHUB_OUTPUT

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\chargestrip.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.exe

  macos:
    runs-on: macos-latest # Apple Silicon (arm64)
    timeout-minutes: 30 # a stuck step shouldn't hold the release for hours
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: App bundle and disk image
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          APP=Chargestrip.app/Contents
          mkdir -p "$APP/MacOS" "$APP/Resources"
          cp target/release/chargestrip "$APP/MacOS/"
          # Icon: .icns with the sizes macOS expects, from the 1024 px PNG.
          mkdir AppIcon.iconset
          for n in 16 32 128 256 512; do
            sips -z $n $n assets/icon.png --out "AppIcon.iconset/icon_${n}x${n}.png" >/dev/null
            sips -z $((n * 2)) $((n * 2)) assets/icon.png --out "AppIcon.iconset/icon_${n}x${n}@2x.png" >/dev/null
          done
          iconutil -c icns AppIcon.iconset -o "$APP/Resources/AppIcon.icns"
          cat > "$APP/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Chargestrip</string>
            <key>CFBundleIdentifier</key><string>com.chargestrip</string>
            <key>CFBundleExecutable</key><string>chargestrip</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$V</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSUIElement</key><true/>
          </dict></plist>
          EOF
          # Ad-hoc signature (no Apple account needed): macOS calls an unsigned bundle "damaged"
          # and refuses to open it; an ad-hoc signed one can be allowed with "Open Anyway".
          # Info.plist is sealed by the signature too.
          codesign --force --deep --sign - Chargestrip.app
          codesign --verify --verbose Chargestrip.app

          # Disk image: the app next to an Applications shortcut, ready to drag and drop.
          mkdir dmg
          cp -R Chargestrip.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Chargestrip -srcfolder dmg -format UDZO "Chargestrip-macOS-$V.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: Chargestrip-macOS-*.dmg

  release:
    # Publish the Windows build even if the macOS job fails (e.g. no macOS runner available).
    needs: [windows, macos]
    if: ${{ always() && github.ref_type == 'tag' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          generate_release_notes: true
